services:
    backend:
        build: .
        ports:
            - '9000:9000'
        environment:
            - DATABASE_URL=postgresql://admin:2468@db:5432/erp_database
            - JWT_SECRET=SuperSecretKey123
    db:
        image: postgres:16
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=2468
            - POSTGRES_DB=erp_database
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: